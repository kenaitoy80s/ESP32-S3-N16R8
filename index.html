<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AsiaFM HLS 实验 · 不改 KenRadio</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
    background: #111; color: #eee; margin: 0; padding: 16px; line-height: 1.5; max-width: 560px; margin-inline: auto; }
  h1 { font-size: 1.15rem; margin: 0 0 8px; }
  .sub { color: #9aa3b2; font-size: 0.8rem; margin-bottom: 14px; }
  .box { background: #1c1f26; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; border: 1px solid #2e3440; }
  .box h2 { font-size: 0.9rem; margin: 0 0 8px; color: #4f8cff; }
  button { background: #4f8cff; color: #fff; border: none; border-radius: 10px; padding: 10px 14px;
    font-size: 0.9rem; cursor: pointer; margin: 4px 6px 4px 0; }
  button.secondary { background: #333; }
  #log { font-family: ui-monospace, monospace; font-size: 0.72rem; white-space: pre-wrap; word-break: break-all;
    max-height: 280px; overflow: auto; background: #0a0c10; padding: 10px; border-radius: 8px; }
  .ok { color: #34d399; }
  .err { color: #f87171; }
  .info { color: #93c5fd; }
  audio { width: 100%; margin-top: 8px; }
  .url { font-size: 0.75rem; color: #9aa3b2; word-break: break-all; }
</style>
</head>
<body>
  <h1>AsiaFM / 喜马拉雅 HLS 实验</h1>
  <div class="sub">独立测试页 · 不修改 KenRadio V1.10 · 引入 hls.js 验证 M3U8 是否可读</div>

  <div class="box">
    <h2>测试地址</h2>
    <div class="url" id="urlText"></div>
    <p style="font-size:0.78rem;color:#9aa3b2;margin-top:6px;">
      当前页面协议: <strong id="proto"></strong> · Origin 将由浏览器自动带上
    </p>
    <button id="btnFetch">1. 仅 fetch 读 M3U8</button>
    <button id="btnHls">2. hls.js 尝试播放</button>
    <button id="btnNative" class="secondary">3. 原生 audio 尝试</button>
    <button id="btnClear" class="secondary">清日志</button>
    <audio id="player" controls></audio>
  </div>

  <div class="box">
    <h2>日志</h2>
    <div id="log"></div>
  </div>

  <div class="box" style="font-size:0.75rem;color:#9aa3b2;">
    <strong>判定标准</strong><br>
    · fetch 得到 200 且正文含 #EXTM3U → 列表可读<br>
    · fetch 得到 403 → 音源服务器限制（跨域），与播放器无关，按计划停止中继投入<br>
    · hls.js 报网络/CORS 错误 → 同上<br>
    · 仅 iOS 原生能播、fetch 403 → 仍属服务端策略差异
  </div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
const STREAM = "https://live.ximalaya.com/radio-first-page-app/live/999/64.m3u8";
const logEl = document.getElementById("log");
const player = document.getElementById("player");
let hls = null;

document.getElementById("urlText").textContent = STREAM;
document.getElementById("proto").textContent = location.protocol + "//" + (location.host || "(本地文件/无 host)");

function log(msg, cls) {
  const line = document.createElement("div");
  if (cls) line.className = cls;
  line.textContent = "[" + new Date().toLocaleTimeString() + "] " + msg;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

document.getElementById("btnClear").onclick = () => { logEl.innerHTML = ""; };

document.getElementById("btnFetch").onclick = async () => {
  log("—— fetch 开始 ——", "info");
  log("请求: " + STREAM, "info");
  try {
    const res = await fetch(STREAM, { method: "GET", cache: "no-store", credentials: "omit" });
    log("HTTP 状态: " + res.status + " " + res.statusText, res.ok ? "ok" : "err");
    log("Content-Type: " + (res.headers.get("content-type") || "(无)"));
    log("ACA-Origin: " + (res.headers.get("access-control-allow-origin") || "(无)"));
    const text = await res.text();
    log("正文前 200 字: " + text.slice(0, 200).replace(/\\n/g, "\\\\n"));
    if (res.status === 403) {
      log("结论: 403 → 服务端拒绝带 Origin 的跨域读取。播放器改再多也拉不到列表。按计划可停止中继投入。", "err");
    } else if (res.ok && text.includes("#EXTM3U")) {
      log("结论: M3U8 可读。若仍不能播，再查分片或解码。", "ok");
    } else {
      log("结论: 非预期响应，见上文状态与正文。", "err");
    }
  } catch (e) {
    log("fetch 异常: " + (e && e.message ? e.message : e), "err");
    log("若提示 Failed to fetch / CORS，同样视为跨域被拦。", "err");
  }
};

document.getElementById("btnHls").onclick = () => {
  log("—— hls.js 开始 ——", "info");
  if (hls) { try { hls.destroy(); } catch (_) {} hls = null; }
  player.removeAttribute("src");
  player.load();

  if (!window.Hls) {
    log("hls.js 未加载（CDN 失败？）", "err");
    return;
  }
  log("Hls.isSupported() = " + Hls.isSupported(), "info");
  log("Hls.version 相关已加载", "info");

  if (Hls.isSupported()) {
    hls = new Hls({ enableWorker: true, debug: false });
    hls.on(Hls.Events.MANIFEST_PARSED, (_, data) => {
      log("MANIFEST_PARSED levels=" + (data && data.levels ? data.levels.length : "?"), "ok");
      player.play().then(() => log("play() OK", "ok")).catch(e => log("play() 被拒: " + e.message, "err"));
    });
    hls.on(Hls.Events.ERROR, (_, data) => {
      log("HLS ERROR type=" + data.type + " details=" + data.details + " fatal=" + data.fatal, "err");
      if (data.response) {
        log("response code=" + data.response.code + " text=" + (data.response.text || "").slice(0, 80), "err");
      }
      if (data.fatal) {
        log("致命错误。若 details 含 FRAGLoading / manifestLoadError 且 code 403 → 服务端限制。", "err");
      }
    });
    hls.loadSource(STREAM);
    hls.attachMedia(player);
    log("已 loadSource + attachMedia", "info");
  } else if (player.canPlayType("application/vnd.apple.mpegurl")) {
    log("无 MSE，尝试原生 HLS (多为 iOS)", "info");
    player.src = STREAM;
    player.play().then(() => log("原生 play OK", "ok")).catch(e => log("原生 play 失败: " + e.message, "err"));
  } else {
    log("既无 hls MSE 也不支持原生 HLS", "err");
  }
};

document.getElementById("btnNative").onclick = () => {
  log("—— 原生 audio.src 开始 ——", "info");
  if (hls) { try { hls.destroy(); } catch (_) {} hls = null; }
  player.src = STREAM;
  player.play().then(() => log("原生 play() Promise OK（不一定真正出声）", "ok"))
    .catch(e => log("原生 play 失败: " + e.message, "err"));
  player.onerror = () => {
    const err = player.error;
    log("audio error code=" + (err && err.code) + " message=" + (err && err.message), "err");
  };
  player.onplaying = () => log("audio playing 事件", "ok");
};

log("页面就绪。请依次点按钮。若在 GitHub Pages 打开，Origin 为你的 https 域名。", "info");
log("Hls 对象: " + (window.Hls ? "已存在" : "加载中/失败"), "info");
</script>
</body>
</html>
